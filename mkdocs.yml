site_name: Grego
site_url: https://moronbandin.github.io/grego

theme:
  name: material
  language: gl

  # CORES (modo claro/escuro con conmutador)
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo       # podes mudar: green, blue, deep purple…
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Mudar a modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Mudar a modo claro

  # FONTE (texto e código)
  font:
    text: "Inter"          # ou "Roboto", "Source Sans 3", "Noto Sans"…
    code: "JetBrains Mono" # ou "Fira Code", "Roboto Mono"…

  # LOGO e FAVICON (pon os ficheiros en docs/assets/)
  logo: assets/logo.svg
  favicon: assets/favicon.png

  # MÁIS FUNCIONALIDADES dispoñibles
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - header.autohide

plugins:
  - search
  - tags

# Extensións Markdown
markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.highlight
  - pymdownx.extra
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# CSS/JS extra para personalizar
extra_css:
  - styles/extra.css
  - https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css  
extra_javascript:
  - js/extra.js
  - https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js
  - js/zoom-init.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - js/mermaid-init.js

# Info do repo (para botón “Editar esta páxina” e ligazóns a GitHub)
repo_url: https://github.com/moronbandin/grego
repo_name: moronbandin/grego
edit_uri: edit/main/docs/

# Avisos, analíticas, social, etc. (opcional)
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/moronbandin
      name: GitHub
  # announcement: "ℹ️ Aviso: entrega da práctica o venres."

